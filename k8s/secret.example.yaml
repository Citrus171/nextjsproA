# Secret のテンプレート（実値は secret.yaml に書く。secret.yaml は gitignore 対象）
# 使い方: cp k8s/secret.example.yaml k8s/secret.yaml して実値を設定 → kubectl apply -f k8s/secret.yaml
# stringData は平文で書ける（apply 時に base64 の data へ変換される）
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: your-db-password
  POSTGRES_DB: nestjs_dev
  # ホスト名は db Service 名（namespace 内 DNS で解決される）
  DATABASE_URL: postgresql://postgres:your-db-password@db:5432/nestjs_dev
  JWT_SECRET: your-jwt-secret
  JWT_REFRESH_SECRET: your-jwt-refresh-secret
  # 32 バイトの base64（生成例: openssl rand -base64 32）
  ENCRYPTION_KEY_V1: your-base64-encryption-key
  HMAC_SECRET: your-hmac-secret
  SENTRY_DSN: https://example@o0.ingest.us.sentry.io/0
