# 秘密でない設定値（compose の environment: に相当）
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # production だと refresh Cookie が Secure になり http では認証不能（docker.md 参照）
  NODE_ENV: development
  PORT: "3000"
  # Ingress 経由のオリジン。k3d のポートマッピングが 8081 のため（docs/k3d-setup.md 参照）
  WEB_ORIGIN: http://nextjsproa.localhost:8081
  ENCRYPTION_KEY_CURRENT: v1
