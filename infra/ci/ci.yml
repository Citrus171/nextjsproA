name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install API deps
        run: |
          cd apps/api
          npm ci
      - name: Run TypeScript build (API)
        run: |
          cd apps/api
          npm run build || true
