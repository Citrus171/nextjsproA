# main へのマージで api / web / migrate イメージを GHCR へ push する（GitOps の供給側）
# Argo CD はこのイメージを参照する charts/nextjsproa を同期する（issue #295）
name: Docker Publish

on:
  push:
    branches: [main]
    # アプリかビルド定義が変わったときだけ実行（docs 変更等では回さない）
    paths:
      - "apps/**"
      - "packages/**"
      - "package*.json"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: # 手動実行（初回 push や再ビルド用）

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: nextjsproa-api
            dockerfile: apps/api/Dockerfile
            target: "" # 最終ステージ（runtime）
          - image: nextjsproa-web
            dockerfile: apps/web/Dockerfile
            target: ""
          - image: nextjsproa-migrate
            dockerfile: apps/api/Dockerfile
            target: build # prisma CLI を含む build ステージを migrate 用に使う
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR へログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ: latest + コミット SHA（どのコミットのイメージか追跡できるように）
      # metadata-action がオーナー名を自動で小文字化する（GHCR は小文字必須）
      - name: メタデータ生成
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: ビルドして push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
