name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: API tests
        run: npm test
        working-directory: apps/api

      - name: Web unit tests
        run: npm test -- --run
        working-directory: apps/web

      - name: Web E2E tests
        run: npm run test:e2e
        working-directory: apps/web

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install api-client deps
        working-directory: packages/api-client
        run: npm install --legacy-peer-deps

      # API checks
      - name: API Lint
        run: npm run lint
        working-directory: apps/api

      - name: API Typecheck
        run: npm run typecheck
        working-directory: apps/api

      - name: API Build
        run: npm run build
        working-directory: apps/api

      # Web checks
      - name: Web Typecheck
        run: node_modules/.bin/tsc --noEmit
        working-directory: apps/web

      - name: Web Build
        run: npm run build
        working-directory: apps/web

      # OpenAPI generation check
      - name: Check OpenAPI generation
        run: |
          npm run openapi
          git diff --exit-code packages/api-client/openapi.json
        working-directory: apps/api
