name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Setup test database
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: API tests
        run: npm test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Web unit tests
        run: npm test -- --run
        working-directory: apps/web

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # E2Eはmainブランチのみ (高速化)
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Setup test database
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'

      - name: Start API server
        run: npm run start &
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_ENV: test

      - name: Wait for API
        run: npx wait-on http://localhost:3000/api-json

      - name: Web E2E tests
        run: npm run test:e2e
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://localhost:3000

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # API checks
      - name: API Lint
        run: npm run lint:api

      - name: API Typecheck
        run: npm run typecheck:api

      - name: API Build
        run: npm run build --workspace=apps-api

      # Web checks
      - name: Web Typecheck
        run: node_modules/.bin/tsc --noEmit
        working-directory: apps/web

      - name: Web Build
        run: npm run build
        working-directory: apps/web

      # OpenAPI generation check
      - name: Check OpenAPI generation
        run: |
          npm run openapi
          git diff --exit-code packages/api-client/openapi.json
        working-directory: apps/api

  review-ready:
    name: Ready for Review
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: success() && github.event_name == 'pull_request'

    steps:
      - name: Comment on PR
        run: |
          gh pr comment ${{ github.event.number }} --body "✅ **All CI checks passed!**

          - Unit Tests: ✅ Passed
          - Code Quality: ✅ Passed
          - E2E Tests: ✅ Passed (main branch only)

          **Ready for Copilot Code Review and human review** 👀"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
