name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Setup test database
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: API tests
        run: npm test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'ci-hmac-secret' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef' }}

      - name: Web unit tests
        run: npm test -- --run
        working-directory: apps/web

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Setup test database
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: API E2E tests
        run: npm run test:e2e
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-test-secret
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'ci-hmac-secret' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef' }}

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'

      - name: Build API
        run: npm run build --workspace=apps-api

      - name: Start API server
        run: npm run start > /tmp/api.log 2>&1 &
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'ci-hmac-secret' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef' }}

      - name: Wait for API
        run: npx wait-on -t 60000 http://localhost:3000/api-json || (cat /tmp/api.log && exit 1)

      - name: Start web dev server
        run: npm run dev > /tmp/web.log 2>&1 &
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Wait for web
        run: npx wait-on -t 30000 http://localhost:5173 || (cat /tmp/web.log && exit 1)

      - name: Web E2E tests
        run: npm run test:e2e
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://localhost:3000

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      # API checks
      - name: API Lint
        run: npm run lint:api

      - name: API Typecheck
        run: npm run typecheck:api

      - name: API Build
        run: npm run build --workspace=apps-api

      # Web checks
      - name: Web Typecheck
        run: npm run typecheck:web

      - name: Web Build
        run: npm run build
        working-directory: apps/web

  review-ready:
    name: Ready for Review
    runs-on: ubuntu-latest
    needs: [test, e2e, quality]
    if: success() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Comment on PR
        run: |
          gh pr comment ${{ github.event.number }} --body "✅ **All CI checks passed!**

          - Unit Tests: ✅ Passed
          - E2E Tests: ✅ Passed
          - Code Quality: ✅ Passed

          **Ready for Copilot Code Review and human review** 👀"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schemathesis:
    name: API Fuzz (Schemathesis)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Setup test database
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Seed test data
        run: npm run seed
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'ci-hmac-secret' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef' }}

      - name: Build API
        run: npm run build --workspace=apps-api

      - name: Start API server
        run: npm run start > /tmp/api.log 2>&1 &
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'ci-hmac-secret' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef' }}

      - name: Wait for API
        run: npx wait-on -t 60000 http://localhost:3000/api-json || (cat /tmp/api.log && exit 1)

      - name: Install Schemathesis
        run: python -m pip install --upgrade pip schemathesis

      - name: Run Schemathesis
        run: |
          THRESHOLD=65
          schemathesis run \
            http://localhost:3000/api-json \
            --checks all \
            --max-examples 25 \
            --continue-on-failure 2>&1 | tee /tmp/schemathesis.log || true
          FAILURES=$(grep -oP '\d+ unique failures' /tmp/schemathesis.log | grep -oP '^\d+' || echo 0)
          echo "Unique failures: ${FAILURES} (threshold: ${THRESHOLD})"
          if [ "${FAILURES}" -gt "${THRESHOLD}" ]; then
            echo "❌ Failures (${FAILURES}) exceeded threshold (${THRESHOLD})"
            exit 1
          fi
          echo "✅ Failures (${FAILURES}) within threshold (${THRESHOLD})"
