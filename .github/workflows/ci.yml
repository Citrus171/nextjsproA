name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: API tests
        run: npm test
        working-directory: apps/api

      - name: Web unit tests
        run: npm test -- --run
        working-directory: apps/web

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # E2Eはmainブランチのみ (高速化)
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'

      - name: Web E2E tests
        run: npm run test:e2e
        working-directory: apps/web

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install api-client deps
        working-directory: packages/api-client
        run: npm ci

      # API checks
      - name: API Lint
        run: npm run lint
        working-directory: apps/api

      - name: API Typecheck
        run: npm run typecheck
        working-directory: apps/api

      - name: API Build
        run: npm run build
        working-directory: apps/api

      # Web checks
      - name: Web Typecheck
        run: node_modules/.bin/tsc --noEmit
        working-directory: apps/web

      - name: Web Build
        run: npm run build
        working-directory: apps/web

      # OpenAPI generation check
      - name: Check OpenAPI generation
        run: |
          npm run openapi
          git diff --exit-code packages/api-client/openapi.json
        working-directory: apps/api
