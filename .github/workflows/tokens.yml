name: Design Tokens

on:
  push:
    branches: ["tokens-update"]
    paths:
      - "apps/web/design-tokens/tokens.json"

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run tokens:build --workspace=apps/web
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate globals.css from design tokens"
          file_pattern: apps/web/src/styles/globals.css
      - uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: tokens-update
          title: "chore: デザイントークン更新"
          body: |
            Tokens Studio から `tokens.json` が更新されました。
            `globals.css` を自動再生成しています。
          labels: design-tokens
