# 既定値（k3d ローカル検証向け）。環境差分は -f や --set で上書きする
# イメージは CI（.github/workflows/docker-publish.yml）が GHCR へ push したものを使う
api:
  image:
    repository: ghcr.io/citrus171/nextjsproa-api
    # 初期値。実際のタグは Argo CD Image Updater が sha- タグで上書きする（issue #302）
    tag: latest
    pullPolicy: IfNotPresent
  # uploads PVC が ReadWriteOnce のため 1 固定（増やすには RWX ストレージか S3 化が必要）
  replicas: 1
  uploadsStorage: 1Gi
  # デフォルトは resource limits なし（k3d ローカル）。values-prod.yaml で上書きする
  resources: {}

web:
  image:
    repository: ghcr.io/citrus171/nextjsproa-web
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}

db:
  image: postgres:16-alpine
  storage: 1Gi
  resources: {}

migrate:
  image:
    repository: ghcr.io/citrus171/nextjsproa-migrate
    tag: latest
    pullPolicy: IfNotPresent

ingress:
  className: traefik
  # Host ヘッダで振り分け（複数プロジェクトを namespace 分離しても 8081 を共有できる）
  host: nextjsproa.localhost
  # TLS/cert-manager 設定。values-prod.yaml で true に上書きする
  tls: false
  certIssuer: letsencrypt-prod

# 秘密でない設定値（ConfigMap になる）
config:
  NODE_ENV: production
  # http Ingress のため Cookie の Secure だけ無効化（NODE_ENV から分離、issue #292）
  COOKIE_SECURE: "false"
  PORT: "3000"
  # Ingress 経由のオリジン。k3d のポートマッピングが 8081 のため
  WEB_ORIGIN: http://nextjsproa.localhost:8081
  ENCRYPTION_KEY_CURRENT: v1

# 秘密情報は templates/sealedsecret.yaml（暗号化済み）で管理する。values では渡さない
