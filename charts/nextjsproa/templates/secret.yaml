# 秘密情報（compose の env_file: apps/api/.env に相当）
# 実値は values-secret.yaml（gitignore 対象）で渡す。未指定なら install を失敗させる
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  {{- if not .Values.secrets }}
  {{- fail "secrets が空です。-f charts/nextjsproa/values-secret.yaml で実値を渡してください（values-secret.example.yaml 参照）" }}
  {{- end }}
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
