# 暗号化済み Secret（Sealed Secrets。issue #295）
# 復号できるのはクラスタ内の sealed-secrets-controller だけなので Git にコミットできる
# クラスタ内で controller が復号し、通常の Secret "app-secrets" を自動生成する
# 値の更新手順: docs/docker.md の「Sealed Secrets 運用」を参照
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: nextjsproa
spec:
  encryptedData:
    DATABASE_URL: 
    ENCRYPTION_KEY_CURRENT: 
    ENCRYPTION_KEY_V1: 
    HMAC_SECRET: 
    JWT_REFRESH_SECRET: 
    JWT_SECRET: 
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
    SENTRY_DSN: 
  template:
    metadata:
      name: app-secrets
      namespace: nextjsproa
    type: Opaque
