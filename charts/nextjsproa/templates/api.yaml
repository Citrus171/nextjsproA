# NestJS API（compose の api サービスに相当）
---
# compose の named volume uploads_data に相当
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  annotations:
    # uninstall してもデータを消さない（再 install 時に同名 PVC を再利用する）
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.api.uploadsStorage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: api
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # ConfigMap + Secret を環境変数として一括注入
          # （compose の env_file + environment に相当。同名キーは後勝ちで Secret が優先）
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # compose の healthcheck に相当（start_period 20s → initialDelaySeconds）
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: uploads
              mountPath: /app/apps/api/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
---
# Service 名は必ず "api"（web の nginx.conf が proxy_pass http://api:3000 で参照する前提）
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
