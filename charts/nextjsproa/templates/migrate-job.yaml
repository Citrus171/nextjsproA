# Prisma マイグレーション（compose の migrate one-shot サービスに相当）
# Helm hook 化: install/upgrade のたびに古い Job を消してから作り直す
# （生YAML 時代の「Job spec は不変のため delete → apply」を hook-delete-policy が自動化）
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # compose の depends_on(db: healthy) の代替（CKA 頻出: initContainer で待ち合わせ）
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: migrate
          image: {{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          workingDir: /app
          command: ["npx", "prisma", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
      restartPolicy: Never
