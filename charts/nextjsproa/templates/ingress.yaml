# 外部公開（compose の web の ports: 8080:80 に相当）
# k3d の 8081:80 マッピング → Traefik → この Ingress → web Service の経路
# /api 等のプロキシは web 内の nginx が担うため、ルールは web への1本だけでよい
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
